<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historias Clínicas - La Mary</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/historia.js"></script>
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg p-0">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="img/logo.jpg" alt="Logo La Mary" class="brand-logo" />
          <span class="brand-name">La Mary</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Abrir menú de navegación"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-lg-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="institucional.html">Institucional</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            <li class="nav-item"><a class="nav-link" href="mascotas.html">Mascotas</a></li>
            <li class="nav-item"><a class="nav-link" href="veterinarios.html">Veterinarios</a></li>
            <li class="nav-item"><a class="nav-link" href="turnos.html">Turnos</a></li>
            <li class="nav-item">
              <a class="nav-link active" href="historias.html" aria-current="page">Historias Clínicas</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="container py-5">
      <div class="row g-4">
        <article class="col-12 col-lg-8">
          <span class="badge rounded-pill text-bg-primary fw-semibold">HISTORIA CLÍNICA</span>
          <h2 class="fs-1 fw-semibold mt-2 mb-4">
            Historias Registradas
            <span class="badge text-bg-secondary align-middle fs-5" id="total">0</span>
          </h2>

          <div class="tabla-card table-responsive">
            <table class="table tabla-admin align-middle">
              <thead>
                <tr>
                  <th>Fecha Registro</th>
                  <th>Fecha</th>
                  <th>Mascota</th>
                  <th>Peso</th>
                  <th>Temp</th>
                  <th>Diagnóstico</th>
                  <th>Tratamiento</th>
                  <th>Próximo Control</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="listado-historias"></tbody>
            </table>
          </div>
        </article>

        <article class="col-12 col-lg-4">
          <form
            class="d-flex flex-column gap-3 p-4 bg-body-tertiary rounded-4"
            id="form-historia"
          >
            <h3 class="fs-4">Nueva Historia Clínica</h3>
            <div id="mensaje"></div>

            <div>
              <label for="selMascota" class="form-label">Mascota</label>
              <select id="selMascota" class="form-select" required></select>
            </div>

            <div>
              <label for="fechaConsulta" class="form-label">Fecha de Consulta</label>
              <input type="date" id="fechaConsulta" class="form-control" required />
            </div>

            <div class="row g-2">
              <div class="col-6">
                <label for="peso" class="form-label">Peso (kg)</label>
                <input type="number" id="peso" class="form-control" step="0.01" min="0.1" required />
              </div>
              <div class="col-6">
                <label for="temperatura" class="form-label">Temperatura (°C)</label>
                <input type="number" id="temperatura" class="form-control" step="0.1" min="30" max="45" required />
              </div>
            </div>

            <div>
              <label for="diagnostico" class="form-label">Diagnóstico</label>
              <input type="text" id="diagnostico" class="form-control" pattern=".*\S.*" required />
            </div>

            <div>
              <label for="tratamiento" class="form-label">Tratamiento</label>
              <textarea id="tratamiento" class="form-control" rows="2" required></textarea>
            </div>

            <div>
              <label for="proximoControl" class="form-label">Fecha del próximo control</label>
              <input type="date" id="proximoControl" class="form-control" required />
            </div>

            <button class="btn btn-primary" type="submit">Registrar Historia Clínica</button>
          </form>
        </article>
      </div>
    </section>
  </main>

  <div class="modal fade" id="modalHistorial" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content rounded-4">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo">Historial Completo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalCuerpo"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
