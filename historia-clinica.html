<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historia Clínica — La Mary</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <script src="./sesion.js"></script>
    <script>
      if (!estaLogueado()) {
        window.location.href = "login.html";
      }
    </script>
    <script defer src="historia-clinica.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar navbar-expand-lg p-0">
        <div class="container">
          <a class="navbar-brand brand" href="index.html">
            <img src="img/logo.jpg" alt="Logo La Mary" class="brand-logo" />
            <span class="brand-name">La Mary</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Abrir menú de navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-lg-auto"></ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="container py-5">
        <div class="row g-4">
          <!-- LISTADO E HISTORIAL -->
          <article class="col-12 col-lg-8">
            <div
              class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3"
            >
              <div>
                <span class="badge rounded-pill text-bg-primary fw-semibold"
                  >HISTORIA CLÍNICA</span
                >
                <h2 class="fs-1 fw-semibold mt-2 mb-0">
                  Registros Clínicos
                  <span
                    class="badge text-bg-secondary align-middle fs-5"
                    id="total"
                    >0</span
                  >
                </h2>
              </div>

              <button
                id="btnExportar"
                type="button"
                class="btn btn-outline-success btn-sm"
              >
                Exportar CSV / Excel
              </button>
            </div>

            <!-- FILTRO POR MASCOTA -->
            <div class="bg-white border rounded-4 p-3 mb-3 shadow-sm">
              <label
                for="filtroMascota"
                class="form-label small fw-bold text-uppercase text-muted mb-1"
                >Ver historia clínica completa de una mascota</label
              >
              <select id="filtroMascota" class="form-select"></select>
            </div>

            <!-- FICHA RESUMEN DE MASCOTA SELECCIONADA -->
            <div
              id="ficha-mascota"
              class="bg-primary-subtle border border-primary-subtle rounded-4 p-3 mb-3 d-none"
            >
              <div id="ficha-mascota-contenido"></div>
            </div>

            <div class="tabla-card table-responsive">
              <table class="table tabla-admin align-middle">
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Mascota</th>
                    <th>Veterinario</th>
                    <th>Diagnóstico y Tratamiento</th>
                    <th>Signos</th>
                    <th>Próx. Control</th>
                    <th class="text-end">Acciones</th>
                  </tr>
                </thead>
                <tbody id="listado-historias"></tbody>
              </table>
            </div>
          </article>

          <!-- FORMULARIO -->
          <article class="col-12 col-lg-4">
            <form
              class="d-flex flex-column gap-3 p-4 bg-body-tertiary rounded-4"
              id="form-historia"
            >
              <h3 class="fs-4" id="tituloFormulario">Nueva Consulta Clínica</h3>

              <div id="mensaje"></div>
              <input type="hidden" id="idHistoria" />

              <div>
                <label for="selMascota" class="form-label">Mascota</label>
                <select id="selMascota" class="form-select" required></select>
              </div>

              <div>
                <label for="selVeterinario" class="form-label"
                  >Veterinario</label
                >
                <select
                  id="selVeterinario"
                  class="form-select"
                  required
                ></select>
              </div>

              <div>
                <label for="fecha" class="form-label">Fecha de atención</label>
                <input type="date" id="fecha" class="form-control" required />
              </div>

              <div class="row g-2">
                <div class="col-6">
                  <label for="peso" class="form-label">Peso (kg)</label>
                  <input
                    type="number"
                    id="peso"
                    class="form-control"
                    min="0.01"
                    step="0.01"
                    placeholder="Ej: 12.5"
                    required
                  />
                </div>
                <div class="col-6">
                  <label for="temperatura" class="form-label">Temp. (°C)</label>
                  <input
                    type="number"
                    id="temperatura"
                    class="form-control"
                    min="30"
                    max="45"
                    step="0.1"
                    placeholder="Ej: 38.5"
                    required
                  />
                </div>
              </div>

              <div>
                <label for="diagnostico" class="form-label">Diagnóstico</label>
                <input
                  type="text"
                  id="diagnostico"
                  class="form-control"
                  pattern=".*\S.*"
                  required
                />
              </div>

              <div>
                <label for="tratamiento" class="form-label"
                  >Tratamiento indicado</label
                >
                <textarea
                  id="tratamiento"
                  class="form-control"
                  rows="3"
                  required
                ></textarea>
              </div>

              <div>
                <label for="proximoControl" class="form-label"
                  >Próximo control (opcional)</label
                >
                <input type="date" id="proximoControl" class="form-control" />
              </div>

              <button
                id="botonGuardarHistoria"
                class="btn btn-primary"
                type="submit"
              >
                Guardar Registro
              </button>
              <button
                id="botonCancelar"
                class="btn btn-outline-secondary d-none"
                type="button"
              >
                Cancelar edición
              </button>
            </form>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 La Mary — Clínica Veterinaria.</p>
        <ul class="footer-nav"></ul>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
