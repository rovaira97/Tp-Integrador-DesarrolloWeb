<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Mascotas — La Mary</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="mascotas.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar navbar-expand-lg p-0">
        <div class="container">
          <a class="navbar-brand brand" href="index.html">
            <img src="img/logo.jpg" alt="Logo La Mary" class="brand-logo" />
            <span class="brand-name">La Mary</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Abrir menú de navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-lg-auto">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="institucional.html">Institucional</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contacto.html">Contacto</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="mascotas.html" aria-current="page"
                  >Mascotas</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="veterinarios.html">Veterinarios</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="container py-5">
        <div class="row g-4">
          <!-- LISTADO Y TABLA -->
          <article class="col-12 col-lg-7">
            <span class="badge rounded-pill text-bg-primary fw-semibold"
              >MASCOTAS</span
            >
            <h2 class="fs-1 fw-semibold mt-2 mb-4">
              Mascotas Registradas
              <span class="badge text-bg-secondary align-middle fs-5" id="total"
                >0</span
              >
            </h2>

            <div class="tabla-card">
              <table class="table tabla-admin align-middle">
                <thead>
                  <tr>
                    <th>Dueño</th>
                    <th>Mascota</th>
                    <th>Color</th>
                    <th>Edad</th>
                    <th>Peso</th>
                    <th class="text-end">Acciones</th>
                  </tr>
                </thead>
                <tbody id="listado-mascotas">
                  <!-- Se llena dinámicamente con JavaScript -->
                </tbody>
              </table>
            </div>
          </article>

          <!-- FORMULARIO DE ALTA / EDICIÓN -->
          <article class="col-12 col-lg-5">
            <form
              class="d-flex flex-column gap-3 p-4 bg-body-tertiary rounded-4"
              id="form-mascota"
            >
              <h3 class="fs-4" id="tituloFormulario">Nueva Mascota</h3>

              <!-- Campo oculto necesario para que funcione la edición -->
              <input type="hidden" name="idMascota" id="idMascota" />

              <div>
                <label for="nombreDuenio" class="form-label">Dueño</label>
                <input
                  type="text"
                  name="nombreDuenio"
                  id="nombreDuenio"
                  class="form-control"
                  pattern=".*\S.*"
                  title="No puede estar vacío"
                  required
                />
              </div>

              <div>
                <label for="nombreMascota" class="form-label"
                  >Nombre de la Mascota</label
                >
                <input
                  type="text"
                  name="nombreMascota"
                  id="nombreMascota"
                  class="form-control"
                  pattern=".*\S.*"
                  title="No puede estar vacío"
                  required
                />
              </div>

              <div>
                <label for="color" class="form-label">Color</label>
                <input
                  type="text"
                  name="color"
                  id="color"
                  class="form-control"
                  pattern=".*\S.*"
                  title="No puede estar vacío"
                  required
                />
              </div>

              <div>
                <label class="form-label" for="edad">Edad</label>
                <input
                  class="form-control"
                  type="number"
                  name="edad"
                  id="edad"
                  min="0"
                  max="30"
                  step="1"
                  required
                />
              </div>

              <div>
                <label class="form-label" for="peso">Peso en kg</label>
                <input
                  class="form-control"
                  type="number"
                  name="peso"
                  id="peso"
                  min="0.01"
                  step="0.01"
                  placeholder="Ejemplo 4.5"
                  required
                />
              </div>

              <button
                id="botonAgregarMascota"
                class="btn btn-primary"
                type="submit"
              >
                Agregar Mascota
              </button>
              <button
                id="botonCancelar"
                class="btn btn-outline-secondary d-none"
                type="button"
              >
                Cancelar edición
              </button>
            </form>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 La Mary — Clínica Veterinaria.</p>
        <ul class="footer-nav">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="institucional.html">Institucional</a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="mascotas.html">Mascotas</a></li>
          <li><a href="veterinarios.html">Veterinarios</a></li>
        </ul>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
