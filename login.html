<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión — La Mary</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="./sesion.js"></script>
    <script defer src="./login.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar navbar-expand-lg p-0">
        <div class="container">
          <a class="navbar-brand brand" href="index.html">
            <img src="img/logo.jpg" alt="Logo La Mary" class="brand-logo" />
            <span class="brand-name">La Mary</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Abrir menú de navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-lg-auto">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="institucional.html">Institucional</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contacto.html">Contacto</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="container py-5">
        <div class="row g-4 justify-content-center align-items-center">
          <article class="col-12 col-md-6 col-lg-5">
            <form
              class="d-flex flex-column gap-3 p-4 bg-body-tertiary rounded-4 shadow-sm"
              id="form-sesion"
            >
              <h3 class="fs-4 mb-2">Iniciar Sesión</h3>

              <div>
                <label for="nombreUsuario" class="form-label fw-semibold"
                  >Nombre de Usuario</label
                >
                <input
                  type="text"
                  name="nombreUsuario"
                  id="nombreUsuario"
                  class="form-control"
                  required
                />
              </div>

              <div>
                <label for="contrasenia" class="form-label fw-semibold"
                  >Contraseña</label
                >
                <input
                  type="password"
                  name="contrasenia"
                  id="contrasenia"
                  class="form-control"
                  required
                />
              </div>

              <span id="mensajeError" class="text-danger small"></span>

              <button
                id="botonIniciarSesion"
                class="btn btn-primary btn-lg w-100 shadow-sm mt-2"
                type="submit"
              >
                Iniciar Sesión
              </button>
            </form>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 La Mary — Clínica Veterinaria.</p>
        <ul class="footer-nav">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="institucional.html">Institucional</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
